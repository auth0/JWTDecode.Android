name: Publish Snapshot (rehearsal)

# Safe dress-rehearsal for the release pipeline. Publishes <version>-SNAPSHOT to the
# Central Portal snapshots repository, which is disposable and overwritable and never
# becomes a permanent Maven Central release. Manually triggered only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # pin@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # pin@v5

      - name: Publish snapshot to the Central Portal snapshots repository
        shell: bash
        run: ./gradlew publishToSonatype -PisSnapshot=true --stacktrace
        env:
          MAVEN_USERNAME: ${{ secrets.OSSR_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSR_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
